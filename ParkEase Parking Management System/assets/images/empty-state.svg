  </defs>
  <!-- Parking Bay Dashed Boundary -->
  <path d="M25 35 L25 95 M95 35 L95 95" stroke="#7C5CFC" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.6"/>
