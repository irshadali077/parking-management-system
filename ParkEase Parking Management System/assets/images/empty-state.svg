  <path d="M48 63 L51 56 L69 56 L72 63 Z" fill="#11151A" stroke="rgba(255,255,255,0.08)"/>
  <!-- Wheels -->
  <circle cx="46" cy="80" r="4.5" fill="#0B0D10" stroke="#7C5CFC" stroke-width="1.5"/>
  <circle cx="74" cy="80" r="4.5" fill="#0B0D10" stroke="#7C5CFC" stroke-width="1.5"/>
  <!-- Headlights -->
  <rect x="42" y="72" width="4" height="2" rx="1" fill="#FEC84B" opacity="0.8"/>
  <rect x="74" y="72" width="4" height="2" rx="1" fill="#FEC84B" opacity="0.8"/>
</svg>
