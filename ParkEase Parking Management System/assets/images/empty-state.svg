  <path d="M42 76 L44 63 C45 57 49 53 55 53 L65 53 C71 53 75 57 76 63 L78 76 C79 78 77 80 75 80 L45 80 C43 80 41 78 42 76 Z" fill="url(#carBody)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
